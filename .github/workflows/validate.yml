name: Databricks Asset Bundle Validation

on:
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  validate:
    name: Render Jinja2 & Validate DAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 databricks-sdk

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v0.2.3

      - name: Render Jinja2 Templates (Dev Target)
        env:
          BUNDLE_TARGET: dev
        run: |
          python scripts/render_bundle.py

      - name: Validate Databricks Bundle (Dev Target)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate -e dev

      - name: Render Jinja2 Templates (Prod Target)
        env:
          BUNDLE_TARGET: prod
        run: |
          python scripts/render_bundle.py

      - name: Validate Databricks Bundle (Prod Target)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate -e prod
